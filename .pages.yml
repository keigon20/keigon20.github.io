# Pages CMS (https://app.pagescms.org): a "write post" screen for the blog.
# Each post it saves is a Markdown file in src/content/notes/, committed to GitHub.
media:
  input: public/notes   # uploaded images are stored here
  output: /notes        # ...and linked from posts at this URL path

content:
  - name: notes
    label: Blog
    type: collection
    path: src/content/notes
    format: yaml-frontmatter
    filename: "{primary}.md"   # title → my-post-title.md → /notes/my-post-title
    view:
      fields: [title, date, draft]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Summary (one line for the post list)
        type: string
      - name: kind
        label: Kind
        type: select
        default: post
        options:
          values: [post, report]
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft (hidden from the live site while on)
        type: boolean
        default: true
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown
